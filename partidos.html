<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Partidos CTPQ</title>
  <link rel="icon" type="image/png" href="logo%20ctpq.png?v=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
  <style>
    :root {
      --azul-logo: #1D4ED8;
      --rojo-logo: #DC2626;
      --fondo: #eef4ff;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --ok: #065f46;
      --ok-bg: #ecfdf5;
      --ok-border: #a7f3d0;
      --err: #b91c1c;
      --err-bg: #fff1f2;
      --err-border: #fecdd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Fredoka', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(29, 78, 216, 0.10), transparent 33%),
        radial-gradient(circle at bottom left, rgba(220, 38, 38, 0.10), transparent 30%),
        linear-gradient(140deg, var(--fondo) 0%, #ffffff 45%, #fff6f6 100%);
      min-height: 100vh;
    }

    .container {
      width: min(1120px, 92vw);
      margin: 0 auto;
      padding: 1.5rem 0 2.5rem;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid rgba(0, 61, 130, 0.12);
      border-radius: 1rem;
      padding: 1rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      margin-bottom: 1rem;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .title img {
      width: 56px;
      height: 56px;
      border-radius: 0.7rem;
      object-fit: cover;
      background: white;
      padding: 0.25rem;
    }

    .title h1 {
      margin: 0;
      line-height: 1;
      font-size: clamp(1.3rem, 2.3vw, 2rem);
      color: var(--azul-logo);
    }

    .subtitle {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn {
      border: 0;
      border-radius: 0.75rem;
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--azul-logo), var(--rojo-logo));
    }

    .btn-secondary {
      color: var(--azul-logo);
      background: #dbeafe;
    }

    .btn-danger {
      color: white;
      background: #dc2626;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(0, 61, 130, 0.12);
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 1rem 0.5rem;
    }

    .card-head h2 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--azul-logo);
    }

    .card-body { padding: 0.8rem 1rem 1rem; }

    .field-wrap { margin-bottom: 0.75rem; }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
      color: #334155;
      font-weight: 600;
    }

    .field {
      width: 100%;
      border: 2px solid #e2e8f0;
      background: white;
      border-radius: 0.75rem;
      padding: 0.7rem 0.75rem;
      outline: none;
      font-family: inherit;
    }

    .field:focus {
      border-color: var(--azul-logo);
      box-shadow: 0 0 0 3px rgba(0, 61, 130, 0.12);
    }

    .preview {
      border: 2px dashed #cbd5e1;
      border-radius: 0.8rem;
      height: 180px;
      display: grid;
      place-items: center;
      background: #f8fafc;
      overflow: hidden;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: white;
    }

    .hint {
      margin: 0.5rem 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .feedback {
      border-radius: 0.75rem;
      padding: 0.65rem 0.8rem;
      font-size: 0.92rem;
      margin-bottom: 0.75rem;
      display: none;
    }

    .feedback.ok {
      display: block;
      color: var(--ok);
      background: var(--ok-bg);
      border: 1px solid var(--ok-border);
    }

    .feedback.error {
      display: block;
      color: var(--err);
      background: var(--err-bg);
      border: 1px solid var(--err-border);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 0.8rem;
      border: 1px solid #e2e8f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
      background: white;
    }

    th, td {
      text-align: left;
      padding: 0.7rem 0.75rem;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.92rem;
    }

    th {
      color: #334155;
      background: #f8fafc;
      position: sticky;
      top: 0;
    }

    .party-line {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .party-thumb {
      width: 38px;
      height: 38px;
      border-radius: 0.55rem;
      object-fit: cover;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      flex-shrink: 0;
    }

    .party-icon {
      width: 38px;
      height: 38px;
      border-radius: 0.55rem;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      flex-shrink: 0;
    }

    .chip {
      border-radius: 999px;
      padding: 0.2rem 0.5rem;
      font-size: 0.8rem;
      border: 1px solid #e2e8f0;
      color: #475569;
      background: #fff;
      display: inline-block;
    }

    .inline-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .small {
      font-size: 0.8rem;
      padding: 0.4rem 0.55rem;
      border-radius: 0.55rem;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem 1rem;
    }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="title">
        <img src="logo%20ctpq.png" alt="Logo CTPQ">
        <div>
          <h1>Gestor de Partidos CTPQ</h1>
          <p class="subtitle">Crear, editar y eliminar partidos para la votacion del CTPQ.</p>
        </div>
      </div>
      <div class="actions">
        <a href="dashboard.html" class="btn btn-secondary"><i class="fa-solid fa-chart-line"></i>Dashboard</a>
        <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-vote-yea"></i>Votacion CTPQ</a>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <div class="card-head">
          <h2 id="form-title">Nuevo partido</h2>
          <button id="reset-btn" class="btn btn-secondary small" type="button"><i class="fa-solid fa-rotate-left"></i>Limpiar</button>
        </div>
        <div class="card-body">
          <div id="feedback" class="feedback"></div>

          <form id="party-form">
            <input type="hidden" id="party-id">

            <div class="field-wrap">
              <label for="party-name">Nombre del partido</label>
              <input id="party-name" class="field" type="text" maxlength="120" required>
            </div>

            <div class="field-wrap">
              <label for="party-candidate">Candidato/a</label>
              <input id="party-candidate" class="field" type="text" maxlength="120" required>
            </div>

            <div class="field-wrap">
              <label for="party-color">Color</label>
              <input id="party-color" class="field" type="color" value="#1D4ED8">
            </div>

            <div class="field-wrap">
              <label for="party-icon">Icono o URL (opcional)</label>
              <input id="party-icon" class="field" type="text" placeholder="⭐ o https://...">
            </div>

            <div class="field-wrap">
              <label for="party-image">Subir foto/logo</label>
              <input id="party-image" class="field" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
              <p class="hint">Si subes imagen, se usa como icono del partido.</p>
            </div>

            <div class="preview" id="image-preview">
              <span style="color:#94a3b8;font-size:0.9rem;">Sin imagen seleccionada</span>
            </div>

            <div style="display:flex; gap:0.5rem; margin-top:0.9rem; flex-wrap:wrap;">
              <button id="save-btn" class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i>Guardar</button>
              <button id="delete-btn" class="btn btn-danger" type="button" disabled><i class="fa-solid fa-trash"></i>Eliminar</button>
            </div>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Partidos registrados</h2>
          <span id="count-chip" class="chip">0 partidos</span>
        </div>
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Partido</th>
                  <th>Candidato/a</th>
                  <th>Color</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="party-tbody">
                <tr><td colspan="4" class="empty">Cargando partidos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    if (!localStorage.getItem('loggedIn')) {
      globalThis.location.href = 'login.html';
    }

    const SUPABASE_URL = 'https://kduvyccprrtuitdngcin.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdXZ5Y2NwcnJ0dWl0ZG5nY2luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NzMzOTYsImV4cCI6MjA5MzI0OTM5Nn0.IASwy18W9WSnqe6J9uRnQP5Jh61NI68VuT0oVDB8Jh8';
    const supabase = globalThis.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('party-form');
    const feedback = document.getElementById('feedback');
    const formTitle = document.getElementById('form-title');
    const saveBtn = document.getElementById('save-btn');
    const deleteBtn = document.getElementById('delete-btn');
    const resetBtn = document.getElementById('reset-btn');
    const partyIdField = document.getElementById('party-id');
    const partyNameField = document.getElementById('party-name');
    const partyCandidateField = document.getElementById('party-candidate');
    const partyColorField = document.getElementById('party-color');
    const partyIconField = document.getElementById('party-icon');
    const partyImageField = document.getElementById('party-image');
    const imagePreview = document.getElementById('image-preview');
    const tbody = document.getElementById('party-tbody');
    const countChip = document.getElementById('count-chip');

    const state = {
      partidos: []
    };

    function showFeedback(message, type) {
      feedback.className = 'feedback ' + type;
      feedback.textContent = message;
    }

    function clearFeedback() {
      feedback.className = 'feedback';
      feedback.textContent = '';
    }

    function isImageValue(value) {
      return /^data:image\//i.test(value)
        || /^https?:\/\//i.test(value)
        || value.includes('/')
        || /\.(png|jpe?g|gif|webp|svg)$/i.test(value);
    }

    function renderPreview(value) {
      imagePreview.innerHTML = '';
      if (!value) {
        imagePreview.innerHTML = '<span style="color:#94a3b8;font-size:0.9rem;">Sin imagen seleccionada</span>';
        return;
      }

      if (isImageValue(value)) {
        const img = document.createElement('img');
        img.src = value;
        img.alt = 'Vista previa';
        imagePreview.appendChild(img);
        return;
      }

      const badge = document.createElement('div');
      badge.className = 'party-icon';
      badge.textContent = value;
      imagePreview.appendChild(badge);
    }

    function resetForm() {
      partyIdField.value = '';
      formTitle.textContent = 'Nuevo partido';
      partyNameField.value = '';
      partyCandidateField.value = '';
      partyColorField.value = '#1D4ED8';
      partyIconField.value = '';
      partyImageField.value = '';
      deleteBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i>Guardar';
      renderPreview('');
      clearFeedback();
    }

    function fillForm(party) {
      partyIdField.value = String(party.id);
      formTitle.textContent = 'Editar partido #' + party.id;
      partyNameField.value = party.nombre || '';
      partyCandidateField.value = party.candidato || '';
      partyColorField.value = party.color || '#1D4ED8';
      partyIconField.value = party.icono || '';
      partyImageField.value = '';
      deleteBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i>Actualizar';
      renderPreview(party.icono || '');
      clearFeedback();
    }

    function partyVisual(icono, color) {
      if (icono && isImageValue(icono)) {
        return '<img class="party-thumb" src="' + icono + '" alt="logo">';
      }
      return '<div class="party-icon" style="color:' + (color || '#1D4ED8') + '">' + (icono || '⭐') + '</div>';
    }

    function renderTable() {
      countChip.textContent = state.partidos.length + (state.partidos.length === 1 ? ' partido' : ' partidos');

      if (!state.partidos.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No hay partidos creados todavía.</td></tr>';
        return;
      }

      tbody.innerHTML = state.partidos.map((party) => (
        '<tr>' +
          '<td><div class="party-line">' +
            partyVisual(party.icono, party.color) +
            '<strong>' + (party.nombre || 'Sin nombre') + '</strong>' +
          '</div></td>' +
          '<td>' + (party.candidato || 'Sin candidato') + '</td>' +
          '<td><span class="chip">' + (party.color || '#1D4ED8') + '</span></td>' +
          '<td><div class="inline-actions">' +
            '<button class="btn btn-secondary small" type="button" data-action="edit" data-id="' + party.id + '"><i class="fa-solid fa-pen"></i>Editar</button>' +
            '<button class="btn btn-danger small" type="button" data-action="delete" data-id="' + party.id + '"><i class="fa-solid fa-trash"></i>Borrar</button>' +
          '</div></td>' +
        '</tr>'
      )).join('');
    }

    async function loadPartidos() {
      const { data, error } = await supabase
        .from('partidos')
        .select('id, nombre, candidato, icono, color')
        .order('id', { ascending: true });

      if (error) {
        console.error('Error al cargar partidos:', error);
        showFeedback('No se pudieron cargar los partidos. Revisa permisos en Supabase.', 'error');
        tbody.innerHTML = '<tr><td colspan="4" class="empty">Error al cargar datos.</td></tr>';
        return;
      }

      state.partidos = data || [];
      renderTable();
    }

    async function saveParty(event) {
      event.preventDefault();
      clearFeedback();

      const id = partyIdField.value.trim();
      const nombre = partyNameField.value.trim();
      const candidato = partyCandidateField.value.trim();
      const color = partyColorField.value;
      const icono = partyIconField.value.trim() || '⭐';

      if (!nombre || !candidato) {
        showFeedback('Nombre y candidato son obligatorios.', 'error');
        return;
      }

      saveBtn.disabled = true;

      try {
        if (!id) {
          const { error } = await supabase
            .from('partidos')
            .insert([{ nombre, candidato, color, icono }]);

          if (error) {
            console.error('Error al crear partido:', error);
            showFeedback('No se pudo crear el partido. Verifica permisos en la tabla partidos.', 'error');
            return;
          }

          showFeedback('Partido creado correctamente.', 'ok');
          resetForm();
          await loadPartidos();
          return;
        }

        const { error } = await supabase
          .from('partidos')
          .update({ nombre, candidato, color, icono })
          .eq('id', Number(id));

        if (error) {
          console.error('Error al actualizar partido:', error);
          showFeedback('No se pudo actualizar el partido.', 'error');
          return;
        }

        showFeedback('Partido actualizado correctamente.', 'ok');
        await loadPartidos();
      } catch (error) {
        console.error('Error inesperado:', error);
        showFeedback('Error inesperado al guardar.', 'error');
      } finally {
        saveBtn.disabled = false;
      }
    }

    async function deleteParty(id) {
      const party = state.partidos.find((item) => item.id === id);
      const name = party ? party.nombre : 'este partido';
      const ok = globalThis.confirm('Se va a eliminar ' + name + '. Esta accion no se puede deshacer.');
      if (!ok) {
        return;
      }

      try {
        const { error } = await supabase
          .from('partidos')
          .delete()
          .eq('id', id);

        if (error) {
          console.error('Error al eliminar partido:', error);
          showFeedback('No se pudo eliminar el partido. Si tiene votos, elimina esos votos primero.', 'error');
          return;
        }

        showFeedback('Partido eliminado.', 'ok');
        if (String(id) === partyIdField.value) {
          resetForm();
        }
        await loadPartidos();
      } catch (error) {
        console.error('Error inesperado:', error);
        showFeedback('Error inesperado al eliminar.', 'error');
      }
    }

    partyImageField.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) {
        return;
      }

      if (file.size > 1.5 * 1024 * 1024) {
        showFeedback('La imagen es muy pesada. Usa una de maximo 1.5 MB.', 'error');
        partyImageField.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const value = String(reader.result || '');
        partyIconField.value = value;
        renderPreview(value);
        clearFeedback();
      };
      reader.onerror = () => {
        showFeedback('No se pudo leer la imagen.', 'error');
      };
      reader.readAsDataURL(file);
    });

    partyIconField.addEventListener('input', () => {
      renderPreview(partyIconField.value.trim());
    });

    tbody.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) {
        return;
      }

      const action = button.dataset.action;
      const id = Number(button.dataset.id);
      const party = state.partidos.find((item) => item.id === id);

      if (action === 'edit' && party) {
        fillForm(party);
      }

      if (action === 'delete') {
        await deleteParty(id);
      }
    });

    deleteBtn.addEventListener('click', async () => {
      const id = Number(partyIdField.value);
      if (!id) {
        return;
      }
      await deleteParty(id);
    });

    resetBtn.addEventListener('click', resetForm);
    form.addEventListener('submit', saveParty);

    resetForm();
    await loadPartidos();
  </script>
</body>
</html>
